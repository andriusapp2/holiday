<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Holiday Shortlist 🌞</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f5ede0;
    --ocean: #1a6b8a;
    --ocean-light: #2a8ab0;
    --sunset: #e8793a;
    --sunset-light: #f4a261;
    --leaf: #4caf7d;
    --leaf-light: #72c49a;
    --text: #2c2c2c;
    --muted: #6e6e6e;
    --card-bg: #ffffff;
    --border: #e8ddd0;
    --liked: #e74c3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--sand);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--ocean) 0%, #0d3d54 60%, #1a5c40 100%);
    color: white;
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    bottom: -20px; left: 0; right: 0;
    height: 40px;
    background: var(--sand);
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.5px;
    margin-bottom: 0.4rem;
  }
  header p {
    opacity: 0.85;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .wave-emoji { font-size: 1.5rem; vertical-align: middle; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    padding: 2rem 1.5rem 1rem;
  }

  .filter-btn {
    background: white;
    border: 2px solid var(--border);
    color: var(--text);
    padding: 0.45rem 1.1rem;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--ocean); color: var(--ocean); }
  .filter-btn.active {
    background: var(--ocean);
    border-color: var(--ocean);
    color: white;
  }
  .filter-btn.liked-filter.active {
    background: var(--liked);
    border-color: var(--liked);
  }

  .sort-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    padding: 0 1.5rem 0.5rem;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--muted);
  }
  .sort-row select {
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 0.3rem 0.7rem;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    background: white;
    color: var(--text);
    cursor: pointer;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.5rem;
    padding: 1rem 1.5rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 3px 18px rgba(0,0,0,0.08);
    transition: transform 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 2px solid transparent;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.13);
  }
  .card.liked {
    border-color: var(--liked);
  }

  /* hidden when filtered */
  .card.hidden { display: none; }

  /* ── CARD HEADER BAND ── */
  .card-band {
    height: 10px;
  }
  .band-capeverde { background: linear-gradient(90deg, #27ae60, #1abc9c); }
  .band-rhodes    { background: linear-gradient(90deg, #e67e22, #f39c12); }
  .band-crete     { background: linear-gradient(90deg, #3498db, #2980b9); }
  .band-zakynthos { background: linear-gradient(90deg, #9b59b6, #8e44ad); }
  .band-kos       { background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .band-corfu     { background: linear-gradient(90deg, #1a6b8a, #0d3d54); }

  /* ── CARD BODY ── */
  .card-body { padding: 1.2rem 1.3rem; flex: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
  }

  .destination-tag {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    margin-bottom: 0.4rem;
    display: inline-block;
  }
  .tag-capeverde  { background: #d5f5e3; color: #1a7a4a; }
  .tag-rhodes     { background: #fdebd0; color: #a84300; }
  .tag-crete      { background: #d6eaf8; color: #1a5276; }
  .tag-zakynthos  { background: #e8daef; color: #6c3483; }
  .tag-kos        { background: #fde8e8; color: #922b21; }
  .tag-corfu      { background: #d0e8f0; color: #0d3d54; }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    margin-bottom: 0.25rem;
  }

  .stars {
    color: #f0a500;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  /* like button */
  .like-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
    transition: transform 0.15s;
    flex-shrink: 0;
    margin-left: 0.5rem;
  }
  .like-btn:hover { transform: scale(1.2); }

  /* rating bar */
  .rating-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.6rem 0;
  }
  .rating-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    width: 80px;
    flex-shrink: 0;
  }
  .rating-track {
    flex: 1;
    background: #f0e9de;
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }
  .rating-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--ocean-light), var(--leaf));
    transition: width 0.6s ease;
  }
  .rating-num {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ocean);
    width: 30px;
    text-align: right;
  }

  /* summary text */
  .summary {
    font-size: 0.88rem;
    color: #555;
    line-height: 1.5;
    margin: 0.6rem 0;
  }

  /* pros/cons */
  .pros-cons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
    margin: 0.7rem 0;
  }
  .pros, .cons {
    background: #f9f5ef;
    border-radius: 10px;
    padding: 0.5rem 0.6rem;
  }
  .pros { border-left: 3px solid var(--leaf); }
  .cons { border-left: 3px solid var(--sunset); }
  .pros h4, .cons h4 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
  }
  .pros h4 { color: var(--leaf); }
  .cons h4 { color: var(--sunset); }
  .pros ul, .cons ul {
    list-style: none;
    padding: 0;
  }
  .pros ul li::before { content: '✓ '; color: var(--leaf); font-weight: 700; }
  .cons ul li::before { content: '✗ '; color: var(--sunset); font-weight: 700; }
  .pros ul li, .cons ul li {
    font-size: 0.78rem;
    color: #555;
    line-height: 1.4;
    margin-bottom: 0.15rem;
  }

  /* tags row */
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.7rem;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.18rem 0.55rem;
    border-radius: 20px;
    background: #eef4fa;
    color: var(--ocean);
    border: 1px solid #c5d9e8;
  }
  .badge.adults { background: #fdebd0; color: #a84300; border-color: #f0c090; }
  .badge.ai     { background: #d5f5e3; color: #1a7a4a; border-color: #a0dbb8; }
  .badge.beach  { background: #d6eaf8; color: #1a5276; border-color: #a0c8e0; }
  .badge.spa    { background: #e8daef; color: #6c3483; border-color: #c8a8d8; }

  /* ── CARD FOOTER ── */
  .card-footer {
    display: flex;
    gap: 0.6rem;
    padding: 0.9rem 1.3rem;
    border-top: 1px solid var(--border);
    background: #fdf9f4;
  }
  .btn-ta, .btn-book {
    flex: 1;
    text-align: center;
    padding: 0.5rem 0;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-ta {
    background: white;
    border: 2px solid var(--ocean);
    color: var(--ocean);
  }
  .btn-ta:hover { background: var(--ocean); color: white; }
  .btn-book {
    background: var(--sunset);
    border: 2px solid var(--sunset);
    color: white;
  }
  .btn-book:hover { background: #c9622e; border-color: #c9622e; }

  /* no book button placeholder */
  .btn-nobook {
    flex: 1;
    text-align: center;
    padding: 0.5rem 0;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    background: #eee;
    color: #999;
    border: 2px dashed #ddd;
  }

  /* notes area */
  .notes-area {
    margin: 0.6rem 0 0;
  }
  .notes-area textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.5rem 0.7rem;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    color: var(--text);
    resize: vertical;
    min-height: 55px;
    background: #fdf9f4;
    transition: border-color 0.2s;
  }
  .notes-area textarea:focus {
    outline: none;
    border-color: var(--ocean);
  }
  .notes-area label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    display: block;
    margin-bottom: 0.2rem;
  }

  /* ── SUMMARY BAR ── */
  .liked-summary {
    position: sticky;
    bottom: 0;
    background: var(--ocean);
    color: white;
    text-align: center;
    padding: 0.75rem 1rem;
    font-weight: 700;
    font-size: 0.95rem;
    z-index: 100;
    transition: all 0.3s;
  }
  .liked-summary span { color: var(--sunset-light); }

  /* ── RESPONSIVE ── */
  @media (max-width: 500px) {
    .pros-cons { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; padding: 1rem; }
  }
</style>
</head>

    tags: ["All-Inclusive", "Beach", "Multiple Pools", "Kids Club", "Family"],
    badges: ["ai","beach"],
    summary: "Large family-focused all-inclusive resort near Kardamena on Kos. Multiple pools, direct beach, kids' club and entertainment programme. Spotlessly clean rooms, great staff. Couples welcome but very family orientated. Bus to Kardamena village nearby.",
    pros: ["Excellent for families with kids", "Spotless rooms (minibar topped up)", "Multiple pools & great beach", "Outstanding staff"],
    cons: ["Very family-focused — less peaceful", "Can feel crowded in peak season", "Limited local dining feeling"],
    taLink: "https://www.tripadvisor.co.uk/Hotel_Review-g659630-d576480-Reviews-Canvas_by_Mitsis_Family_Village-Kardamena_Kos_Dodecanese_South_Aegean.html",
    bookLink: null,
  },
  {
    id: "mythos-palace",
    name: "Mythos Palace Resort (Adults Only)",
    dest: "corfu",
    destLabel: "Chlomos, Corfu",
    stars: 5,
    rating: 4.0,
    reviews: 2096,
    tags: ["Adults Only", "All-Inclusive", "5-Star", "Ionian Sea Views", "4 Pools", "Spa"],
    badges: ["adults","ai","beach","spa"],
    summary: "Adults-only 5-star resort on the quiet south-east coast of Corfu with breathtaking Ionian Sea views. 4 pools, rooftop bar, spa, and themed restaurant nights. Very peaceful and romantic — ideal for couples. Remote location: car/taxi needed to explore.",
    pros: ["Stunning Ionian sea views", "Rooftop bar & sunset views", "Adults-only — very peaceful", "Excellent food with themed nights"],
    cons: ["Very remote — need a car/taxi", "Steep slopes on site", "Some rooms need refurbishment", "45 min from Corfu Airport"],
    taLink: "https://www.tripadvisor.co.uk/Hotel_Review-g2290791-d20142612-Reviews-Mythos_Palace_Resort_Adults_Only-Chlomos_Corfu_Ionian_Islands.html",
    bookLink: null,
  },
];

const likedSet = new Set(JSON.parse(localStorage.getItem('likedHotels') || '[]'));
const notes = JSON.parse(localStorage.getItem('hotelNotes') || '{}');

function saveLiked() {
  localStorage.setItem('likedHotels', JSON.stringify([...likedSet]));
}
function saveNotes() {
  localStorage.setItem('hotelNotes', JSON.stringify(notes));
}

function renderStars(n) {
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function renderCard(h) {
  const liked = likedSet.has(h.id);
  const noteVal = notes[h.id] || '';
  return `
  <div class="card ${liked ? 'liked' : ''}" data-id="${h.id}" data-dest="${h.dest}" data-rating="${h.rating}">
    <div class="card-band band-${h.dest}"></div>
    <div class="card-body">
      <div>
        <span class="destination-tag tag-${h.dest}">${h.destLabel}</span>
      </div>
      <div class="card-top">
        <div>
          <div class="card-title">${h.name}</div>
          <div class="stars">${renderStars(h.stars)}</div>
        </div>
        <button class="like-btn" data-id="${h.id}" title="Like this hotel">${liked ? '❤️' : '🤍'}</button>
      </div>

      <div class="rating-row">
        <span class="rating-label">TA Rating</span>
        <div class="rating-track"><div class="rating-fill" style="width:${(h.rating/5)*100}%"></div></div>
        <span class="rating-num">${h.rating.toFixed(1)}</span>
      </div>
      <div class="rating-row">
        <span class="rating-label">Reviews</span>
        <div class="rating-track"><div class="rating-fill" style="width:${Math.min((h.reviews/5000)*100,100)}%;background:linear-gradient(90deg,#e8793a,#f4a261)"></div></div>
        <span class="rating-num" style="font-size:0.72rem;color:var(--sunset)">${h.reviews.toLocaleString()}</span>
      </div>

      <p class="summary">${h.summary}</p>

      <div class="pros-cons">
        <div class="pros">
          <h4>✅ Pros</h4>
          <ul>${h.pros.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>
        <div class="cons">
          <h4>⚠️ Watch out</h4>
          <ul>${h.cons.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>
      </div>

      <div class="badges">
        ${h.tags.map(t => {
          const b = t.toLowerCase().replace(/[^a-z]/g,'');
          const cls = h.badges.find(x => b.includes(x)) || '';
          return `<span class="badge ${cls}">${t}</span>`;
        }).join('')}
      </div>

      <div class="notes-area">
        <label>📝 Your notes</label>
        <textarea data-id="${h.id}" placeholder="Add your thoughts here…">${noteVal}</textarea>
      </div>
    </div>

    <div class="card-footer">
      <a class="btn-ta" href="${h.taLink}" target="_blank">🔍 TripAdvisor</a>
      ${h.bookLink
        ? `<a class="btn-book" href="${h.bookLink}" target="_blank">✈️ Book Now</a>`
        : `<span class="btn-nobook">Search to Book</span>`}
    </div>
  </div>`;
}

let currentFilter = 'all';
let currentSort = 'default';

function getFiltered() {
  let list = [...hotels];
  if (currentFilter === 'liked') {
    list = list.filter(h => likedSet.has(h.id));
  } else if (currentFilter !== 'all') {
    list = list.filter(h => h.dest === currentFilter);
  }
  if (currentSort === 'rating-hi') list.sort((a,b) => b.rating - a.rating);
  if (currentSort === 'rating-lo') list.sort((a,b) => a.rating - b.rating);
  return list;
}

function render() {
  const grid = document.getElementById('grid');
  const list = getFiltered();
  if (list.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:1.1rem;">No hotels match this filter yet. Like some hotels first! 💛</p>';
  } else {
    grid.innerHTML = list.map(renderCard).join('');
  }
  updateLikedSummary();
  attachEvents();
}

function updateLikedSummary() {
  document.getElementById('liked-count').textContent = likedSet.size;
}

function attachEvents() {
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = btn.dataset.id;
      if (likedSet.has(id)) {
        likedSet.delete(id);
        btn.textContent = '🤍';
        btn.closest('.card').classList.remove('liked');
      } else {
        likedSet.add(id);
        btn.textContent = '❤️';
        btn.closest('.card').classList.add('liked');
      }
      saveLiked();
      updateLikedSummary();
      if (currentFilter === 'liked') render();
    });
  });

  document.querySelectorAll('textarea[data-id]').forEach(ta => {
    ta.addEventListener('input', () => {
      notes[ta.dataset.id] = ta.value;
      saveNotes();
    });
  });
}

// filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// sort
document.getElementById('sort-select').addEventListener('change', e => {
  currentSort = e.target.value;
  render();
});

render();
</script>
</body>
</html>
