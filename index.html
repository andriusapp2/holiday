<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sand: #F5EDD6; --sand-light: #FBF6EC;
  --ocean: #0A9396; --ocean-deep: #005F73; --ocean-light: #E0F4F4;
  --coral: #E76F51; --coral-deep: #AE4A2B;
  --sunrise: #F4A261; --gold: #E9C46A; --palm: #2D6A4F;
  --heart: #E8335A; --thumbup: #2D9B6F; --thumbdown: #8B6BB1;
  --text: #1C1917; --text-muted: #78716C; --border: rgba(0,95,115,0.12);
  --card-bg: #FFFFFF; --bg: var(--sand-light);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 380px; background: linear-gradient(160deg, var(--ocean-deep) 0%, var(--ocean) 55%, #52B3B6 100%); z-index: 0; clip-path: ellipse(120% 100% at 50% 0%); }

/* LOGIN */
#loginScreen { position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.login-card { background: var(--card-bg); border-radius: 28px; padding: 2.5rem 2rem 2rem; box-shadow: 0 32px 64px -12px rgba(0,95,115,0.25), 0 0 0 1px rgba(0,95,115,0.08); max-width: 380px; width: 100%; text-align: center; animation: floatUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
@keyframes floatUp { from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)} }
.login-palm { font-size: 3rem; margin-bottom: .75rem; animation: sway 3s ease-in-out infinite; display: inline-block; }
@keyframes sway { 0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)} }
.login-card h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--ocean-deep); letter-spacing: -.5px; margin-bottom: 4px; }
.login-card p { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 2rem; }
.login-users { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
.login-user-btn { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 16px; border: 1.5px solid var(--border); background: var(--sand-light); cursor: pointer; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); text-align: left; font-family: 'DM Sans', sans-serif; }
.login-user-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,95,115,0.15); border-color: var(--ocean); background: var(--ocean-light); }
.login-user-btn:active { transform: translateY(0); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; font-family: 'Playfair Display', serif; }
.login-user-name { font-size: 15px; font-weight: 600; display: block; color: var(--text); }
.login-user-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.login-footer { font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
.login-footer::before,.login-footer::after { content: ''; display: block; height: 1px; width: 40px; background: var(--border); }

/* MAIN */
#mainApp { display: none; position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 0 1rem 5rem; }
.app-header { padding: 2.5rem 0 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.header-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; color: #fff; letter-spacing: -.5px; line-height: 1.1; }
.header-sub { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 400; margin-top: 4px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,0.3); border-radius: 40px; padding: 7px 14px 7px 9px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; transition: all 0.2s; }
.user-pill:hover { background: rgba(255,255,255,0.25); }
.avatar-sm { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.logout-hint { font-size: 10px; opacity: .65; margin-left: 2px; }
.sound-toggle { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,0.3); border-radius: 40px; padding: 7px 14px; font-size: 12px; font-weight: 600; color: #fff; cursor: pointer; transition: all 0.2s; user-select: none; }
.sound-toggle:hover { background: rgba(255,255,255,0.25); }

.content-area { background: var(--bg); border-radius: 28px 28px 0 0; padding: 1.75rem 1.5rem 0; position: relative; }
.sync-bar { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 1.5rem; padding: 0 2px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--palm); flex-shrink: 0; }
.sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
.sync-dot.err { background: var(--coral); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
.sync-btn { margin-left: auto; font-size: 11px; font-weight: 600; padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card-bg); cursor: pointer; font-family: 'DM Sans',sans-serif; color: var(--text-muted); transition: all .15s; }
.sync-btn:hover { border-color: var(--ocean); color: var(--ocean); }

.add-section { background: var(--card-bg); border-radius: 20px; border: 1.5px solid var(--border); padding: 1.25rem 1.4rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,95,115,0.06); }
.add-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ocean); display: block; margin-bottom: 10px; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; font-size: 13.5px; font-weight: 400; padding: 10px 15px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--sand-light); color: var(--text); font-family: 'DM Sans',sans-serif; outline: none; transition: border-color .15s; }
.add-row input:focus { border-color: var(--ocean); background: #fff; }
.add-row input::placeholder { color: #B5AFA8; }
.btn { font-family: 'DM Sans',sans-serif; font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 12px; border: none; background: linear-gradient(135deg,var(--ocean) 0%,var(--ocean-deep) 100%); color: #fff; cursor: pointer; transition: all 0.2s; white-space: nowrap; box-shadow: 0 4px 12px rgba(10,147,150,0.3); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(10,147,150,0.4); }
.btn:active { transform: translateY(0); }
.fetch-status { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; min-height: 16px; font-weight: 500; }

.hotels-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(420px,1fr)); gap: 1.25rem; margin-bottom: 2rem; }

/* CARD */
.hotel-card { background: var(--card-bg); border-radius: 20px; border: 1.5px solid var(--border); overflow: hidden; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s; box-shadow: 0 4px 16px rgba(0,95,115,0.06); animation: cardIn .35s cubic-bezier(0.16,1,0.3,1) both; position: relative; }
@keyframes cardIn { from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)} }
.hotel-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,95,115,0.12); }
.hotel-card.winner { border-color: var(--gold); box-shadow: 0 4px 20px rgba(233,196,106,0.25); }
.hotel-card.winner:hover { box-shadow: 0 16px 40px rgba(233,196,106,0.3); }
.hotel-card.is-fav { border-color: var(--heart); box-shadow: 0 4px 20px rgba(232,51,90,0.2); }
.winner-badge { position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg,var(--gold),var(--sunrise)); color: #4A2C00; font-size: 10.5px; font-weight: 700; padding: 4px 11px; border-radius: 20px; z-index: 5; letter-spacing: .3px; box-shadow: 0 2px 8px rgba(233,196,106,0.4); }

.card-img { width: 100%; height: 160px; object-fit: cover; display: block; }
.card-img-placeholder { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; position: relative; overflow: hidden; }
.card-img-placeholder::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom,transparent 50%,rgba(0,0,0,0.12) 100%); }

/* QUICK REACT bubbles — float above the image bottom edge */
.quick-react { position: absolute; top: 126px; left: 0; right: 0; z-index: 6; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 12px; }
.qr-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
.qr-btn:hover { transform: scale(1.22); }
.qr-btn:active { transform: scale(0.88); }
.qr-btn.heart-btn.on { background: var(--heart); border-color: #C41F45; }
.qr-btn.up-btn.on   { background: var(--thumbup); border-color: #1A7550; }
.qr-btn.down-btn.on { background: var(--thumbdown); border-color: #6A4D9A; }
@keyframes reactPop { 0%{transform:scale(1)} 40%{transform:scale(1.5)} 70%{transform:scale(0.86)} 100%{transform:scale(1)} }
.qr-btn.popping { animation: reactPop .38s cubic-bezier(0.34,1.56,0.64,1); }

/* BURST */
.burst { position: fixed; pointer-events: none; z-index: 9999; font-size: 24px; animation: burstFly .85s ease-out forwards; }
@keyframes burstFly { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(1.6)} }

.card-body { padding: 14px 16px 16px; }
.hotel-name { font-family: 'Playfair Display',serif; font-size: 16px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; color: var(--text); outline: none; cursor: text; }
.hotel-name:focus { text-decoration: underline; text-decoration-color: var(--ocean); text-decoration-style: dotted; }
.hotel-location { font-size: 12px; color: var(--text-muted); font-weight: 500; outline: none; cursor: text; margin-bottom: 8px; display: block; }
.info-badges { display: flex; gap: 6px; margin-bottom: 11px; flex-wrap: wrap; }
.info-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-temp { background: #FFF3E0; color: #E65100; }
.badge-beach { background: #E0F4F4; color: var(--ocean-deep); }
.section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ocean); display: block; margin-bottom: 5px; }

/* REACTION PILLS row */
.reaction-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.reaction-pill { display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 20px; font-size: 15px; font-weight: 600; border: 1.5px solid var(--border); background: var(--sand-light); cursor: pointer; transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1); user-select: none; }
.reaction-pill:hover { transform: scale(1.08); }
.reaction-pill:active { transform: scale(0.94); }
.reaction-pill .pill-count { font-size: 11px; min-width: 8px; }
.reaction-pill.heart-pill.on { background: #FDEEF2; border-color: var(--heart); color: var(--heart); }
.reaction-pill.up-pill.on   { background: #E6F5EF; border-color: var(--thumbup); color: var(--thumbup); }
.reaction-pill.down-pill.on { background: #F0ECF8; border-color: var(--thumbdown); color: var(--thumbdown); }

.star-picker { display: flex; gap: 2px; margin-bottom: 12px; }
.star-btn { background: none; border: none; cursor: pointer; font-size: 22px; padding: 2px; line-height: 1; opacity: .2; transition: opacity .1s,transform .15s cubic-bezier(0.34,1.56,0.64,1); }
.star-btn.active { opacity: 1; }
.star-btn:hover { transform: scale(1.3); opacity: .7; }

.field-input { width: 100%; font-size: 12px; font-weight: 400; padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--sand-light); color: var(--text); font-family: 'DM Sans',sans-serif; outline: none; transition: border-color .15s; margin-bottom: 10px; }
.field-input:focus { border-color: var(--ocean); background: #fff; }
.field-input::placeholder { color: #C4BCB4; }
textarea.field-input { resize: none; min-height: 52px; line-height: 1.5; }

.hotel-url { font-size: 11.5px; color: var(--ocean); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; margin-bottom: 12px; text-decoration: none; }
.hotel-url:hover { text-decoration: underline; }
.url-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ocean); flex-shrink: 0; }

/* PRICE */
.price-block { margin-bottom: 12px; }
.price-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.price-block-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ocean); }
.price-incl { font-size: 10px; color: var(--text-muted); font-weight: 500; font-style: italic; }
.price-section { display: flex; gap: 8px; margin-bottom: 6px; }
.price-field { flex: 1; }
.price-field label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); display: block; margin-bottom: 4px; }
.price-input-wrap { position: relative; }
.price-input-wrap .currency { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; color: var(--text-muted); pointer-events: none; }
.price-input { width: 100%; font-size: 13px; font-weight: 600; padding: 8px 10px 8px 22px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--sand-light); color: var(--text); font-family: 'DM Sans',sans-serif; outline: none; transition: border-color .15s; }
.price-input:focus { border-color: var(--ocean); background: #fff; }
.price-input::placeholder { color: #C4BCB4; font-weight: 400; }
.price-breakdown { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.price-breakdown-item { display: flex; align-items: center; justify-content: space-between; background: var(--ocean-light); border-radius: 10px; padding: 8px 12px; }
.price-breakdown-item .pb-lbl { font-size: 11px; color: var(--ocean); font-weight: 500; }
.price-breakdown-item .pb-val { font-size: 13px; font-weight: 700; color: var(--ocean-deep); font-family: 'Playfair Display',serif; }

.votes-section { border-top: 1.5px solid var(--border); padding-top: 12px; margin-top: 4px; }
.votes-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ocean); margin-bottom: 9px; }
.voter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.voter-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.voter-name { font-size: 12px; font-weight: 600; flex-shrink: 0; width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.my-vote-stars { display: flex; gap: 1px; }
.vote-score { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-left: auto; }
.other-vote { font-size: 13px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.avg-score { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 9px 13px; background: var(--ocean-light); border-radius: 12px; }
.avg-label { font-size: 11.5px; color: var(--ocean-deep); font-weight: 500; }
.avg-val { font-size: 20px; font-weight: 700; font-family: 'Playfair Display',serif; color: var(--ocean-deep); }

.card-actions { display: flex; gap: 6px; margin-top: 11px; }
.icon-btn { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: none; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans',sans-serif; transition: all .15s; }
.icon-btn:hover { background: var(--sand-light); border-color: #C4BCB4; color: var(--text); }
.icon-btn.remove { color: var(--coral); border-color: rgba(231,111,81,0.2); }
.icon-btn.remove:hover { background: rgba(231,111,81,0.07); border-color: var(--coral); }

.empty-state { text-align: center; padding: 4rem 1.5rem; color: var(--text-muted); border: 2px dashed rgba(10,147,150,0.2); border-radius: 20px; margin-bottom: 2rem; background: rgba(224,244,244,0.3); }
.empty-state .big { font-size: 3.5rem; margin-bottom: 12px; display: block; }
.empty-state p { font-size: 14px; font-weight: 500; }

.result-bar { background: var(--card-bg); border-radius: 20px; border: 1.5px solid var(--border); padding: 1.4rem 1.5rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,95,115,0.06); }
.result-bar h3 { font-family: 'Playfair Display',serif; font-size: 19px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
.rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rank-num { font-size: 17px; width: 26px; flex-shrink: 0; }
.rank-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-bar-wrap { width: 110px; height: 6px; background: var(--ocean-light); border-radius: 3px; overflow: hidden; }
.rank-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg,var(--ocean),var(--ocean-deep)); transition: width .6s cubic-bezier(0.16,1,0.3,1); }
.rank-score { font-size: 13px; font-weight: 700; width: 30px; text-align: right; color: var(--ocean-deep); }

/* CONFETTI */
.confetti-piece { position: fixed; pointer-events: none; z-index: 9999; border-radius: 2px; animation: confettiFall linear forwards; }
@keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* ═══════════════ MOBILE ═══════════════ */
@media (max-width: 600px) {
  body::before { height: 260px; }

  /* LOGIN */
  #loginScreen { padding: 1.25rem; align-items: flex-end; padding-bottom: 2rem; }
  .login-card { border-radius: 24px; padding: 2rem 1.25rem 1.5rem; }
  .login-palm { font-size: 2.4rem; }
  .login-card h1 { font-size: 1.7rem; }
  .login-user-btn { padding: 16px 14px; border-radius: 14px; }
  .avatar { width: 40px; height: 40px; font-size: 1rem; }
  .login-user-name { font-size: 16px; }

  /* HEADER */
  #mainApp { padding: 0 0.75rem 6rem; }
  .app-header { padding: 1.5rem 0 1rem; gap: 0.5rem; }
  .header-title { font-size: 1.6rem; }
  .header-sub { font-size: 12px; }
  .header-right { gap: 6px; }
  .sound-toggle { padding: 6px 10px; font-size: 11px; }
  .user-pill { padding: 6px 10px 6px 7px; font-size: 12px; }
  .logout-hint { display: none; }

  /* CONTENT AREA */
  .content-area { border-radius: 20px 20px 0 0; padding: 1.25rem 0.875rem 0; }
  .sync-bar { margin-bottom: 1rem; }

  /* ADD SECTION */
  .add-section { padding: 1rem; margin-bottom: 1.25rem; border-radius: 16px; }
  .add-row { flex-direction: column; gap: 8px; }
  .add-row input { font-size: 16px; padding: 13px 14px; border-radius: 12px; }
  .btn { width: 100%; padding: 13px; font-size: 15px; border-radius: 12px; }

  /* GRID — single column */
  .hotels-grid { grid-template-columns: 1fr; gap: 0.875rem; }

  /* CARD */
  .hotel-card { border-radius: 18px; }
  .card-img-placeholder { height: 140px; font-size: 3rem; }
  .card-body { padding: 14px 14px 16px; }
  .hotel-name { font-size: 17px; }
  .hotel-location { font-size: 12.5px; }

  /* BADGES */
  .info-badge { font-size: 12px; padding: 4px 10px; }

  /* REACTION PILLS — full width row */
  .reaction-row { gap: 8px; }
  .reaction-pill { flex: 1; justify-content: center; padding: 11px 10px; font-size: 16px; border-radius: 14px; }

  /* STARS — bigger touch targets */
  .star-btn { font-size: 26px; padding: 4px; }

  /* Notes */
  textarea.field-input { font-size: 15px; min-height: 60px; padding: 10px 12px; }

  /* PRICE */
  .price-input { font-size: 15px; padding: 10px 10px 10px 22px; }
  .price-breakdown-item .pb-val { font-size: 13px; }

  /* VOTES */
  .voter-name { width: 52px; font-size: 11px; }
  .my-vote-stars { gap: 0; }
  .avg-val { font-size: 22px; }

  /* RANKING */
  .result-bar { border-radius: 16px; padding: 1.1rem 1rem; margin-bottom: 1.25rem; }
  .rank-bar-wrap { width: 70px; }
  .rank-name { font-size: 12px; }

  /* Remove hover effects on touch */
  .hotel-card:hover { transform: none; box-shadow: 0 4px 16px rgba(0,95,115,0.06); }
  .hotel-card.winner:hover { box-shadow: 0 4px 20px rgba(233,196,106,0.25); }
  .reaction-pill:hover { transform: none; }

<script>
/* ═══════════════ MOBILE DETECTION ═══════════════ */
const isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) || window.innerWidth <= 600;
if (isMobile) {

/* ═══════════════ SOUND ENGINE ═══════════════ */
let audioCtx = null, soundEnabled = true;
function getCtx(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(freq,type,dur,vol,delay=0){
  if(!soundEnabled) return;
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=freq;
    const t=c.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
const SFX={
  login(){ [392,523,659].forEach((f,i)=>tone(f,'sine',.25,.15,i*.09)); },
  add(){   [261,329,392,523].forEach((f,i)=>tone(f,'sine',.18,.18,i*.07)); },
  heart(){ tone(220,'sine',.12,.25,0);tone(277,'sine',.12,.2,.13);tone(330,'sine',.18,.15,.22); },
  heartOff(){ tone(330,'sine',.1,.12,0);tone(220,'sine',.1,.1,.08); },
  thumbUp(){  tone(440,'square',.04,.08,0);tone(660,'sine',.16,.18,.04);tone(880,'sine',.12,.12,.1); },
  thumbDown(){ tone(300,'sawtooth',.04,.12,0);tone(200,'sine',.14,.15,.06);tone(150,'sine',.1,.1,.14); },
  star(){  [523,659,784,1047].forEach((f,i)=>tone(f,'sine',.1,.12,i*.04)); },
  remove(){ tone(200,'sawtooth',.07,.18,0);tone(100,'sawtooth',.1,.15,.06); },
  winner(){ [523,523,523,415,523,622,698].forEach((f,i)=>tone(f,'sine',.22,.2,i*.1)); }
};
function toggleSound(){
  soundEnabled=!soundEnabled;
  document.getElementById('soundToggle').textContent=soundEnabled?'🔊 Sound on':'🔇 Sound off';
}

/* ═══════════════ DATA ═══════════════ */
const USERS={
  andrius:{name:'Andrius',bg:'linear-gradient(135deg,#E9C46A,#F4A261)',color:'#C88B00',textColor:'#4A2C00',initial:'A'},
  beatrix:{name:'Beatrix',bg:'linear-gradient(135deg,#E76F51,#c0392b)',color:'#E76F51',textColor:'#fff',initial:'B'}
};
const PALETTES=[
  {bg:'linear-gradient(135deg,#0A9396,#005F73)',emoji:'🌊'},
  {bg:'linear-gradient(135deg,#E76F51,#AE4A2B)',emoji:'🌅'},
  {bg:'linear-gradient(135deg,#E9C46A,#F4A261)',emoji:'🌴'},
  {bg:'linear-gradient(135deg,#2D6A4F,#1B4332)',emoji:'🌿'},
  {bg:'linear-gradient(135deg,#84A98C,#52796F)',emoji:'🏔️'},
  {bg:'linear-gradient(135deg,#6A4C93,#4A2C6A)',emoji:'🌸'},
  {bg:'linear-gradient(135deg,#F4A261,#E76F51)',emoji:'🎠'},
  {bg:'linear-gradient(135deg,#0077B6,#023E8A)',emoji:'🏙️'},
];
const KEY='hotelapp_hotels_v5';
const DB_FILENAME='database.json';
let currentUser=null,hotels=[],syncInterval=null,saving=false;

async function sGet(k,s){try{const r=await window.storage.get(k,s);return r?r.value:null}catch(e){return null}}
async function sSet(k,v,s){try{await window.storage.set(k,v,s);return true}catch(e){return false}}

/* ─── FILE SYSTEM (database.json) ─── */
let _autoExportTimer=null;

function downloadJson(){
  // Always works — triggers browser Save dialog / Downloads folder
  const json=JSON.stringify(hotels,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=DB_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function exportToFile(){
  if(!hotels.length)return;
  downloadJson();
  setSS('ok','database.json downloaded ✓');
}

async function autoExport(){
  if(!hotels.length)return;
  // Always save to localStorage so data survives refresh
  try{localStorage.setItem('db_auto_backup',JSON.stringify(hotels));}catch(e){}
  // Debounce auto-download — only download once per batch of changes
  clearTimeout(_autoExportTimer);
  _autoExportTimer=setTimeout(()=>{
    downloadJson();
    setSS('ok','database.json saved ✓');
  },2000);
}

function importFromFile(){
  document.getElementById('fileImportInput').click();
}

async function handleFileImport(input){
  const file=input.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!Array.isArray(data))throw new Error('Invalid format');
    hotels=data;
    await persist();
    render();
    setSS('ok',`Imported ${data.length} hotels ✓`);
  }catch(e){setSS('err','Import failed: '+e.message);}
  input.value='';
}

// Auto-load from localStorage backup on startup
function tryLoadLocalBackup(){
  try{
    const bk=localStorage.getItem('db_auto_backup');
    if(bk){const d=JSON.parse(bk);if(Array.isArray(d)&&d.length)return d;}
  }catch(e){}
  return null;
}

async function login(uid){
  SFX.login(); currentUser=uid; const u=USERS[uid];
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  const p=document.getElementById('pillAvatar');
  p.style.background=u.bg;p.style.color=u.textColor;p.textContent=u.initial;
  document.getElementById('pillName').textContent=u.name;
  await syncAll();
  // Merge localStorage price backup (from mid-type refresh) into freshly synced data
  if(window._priceBackup){
    let merged=false;
    window._priceBackup.forEach(bh=>{
      const h=hotels.find(h=>h.id===bh.id);
      if(h&&(bh.price7||bh.price10)){
        if(bh.price7&&bh.price7!==h.price7){h.price7=bh.price7;merged=true;}
        if(bh.price10&&bh.price10!==h.price10){h.price10=bh.price10;merged=true;}
      }
    });
    window._priceBackup=null;
    if(merged){await persist();render();}
  }
  syncInterval=setInterval(syncAll,8000);
}
function logout(){
  currentUser=null;if(syncInterval)clearInterval(syncInterval);syncInterval=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';hotels=[];
}
function setSS(state,msg){
  document.getElementById('syncDot').className='sync-dot'+(state==='syncing'?' syncing':state==='err'?' err':'');
  document.getElementById('syncMsg').textContent=msg;
}
const SEED_HOTELS=[
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g482848-d10678936-Reviews-Melia_Llana_Beach_Resort_Spa_All_Inclusive_Adults_only-Santa_Maria_Ilha_do_Sal.html',name:'Melía Llana Beach Resort & Spa',location:'Santa Maria, Sal, Cape Verde',julyTemp:29,beach:'On the beach'},
  {url:'https://www.easyjet.com/en/holidays/cape-verde/sal/santa-maria/melia-llana?ibf=true&to=05-06-2026&from=29-05-2026',name:'Melía Llana — EasyJet Package',location:'Santa Maria, Sal, Cape Verde',julyTemp:29,beach:'On the beach'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g635613-d316715-Reviews-Sol_Cosmopolitan_Rhodes-Rhodes_Town_Rhodes_Dodecanese_South_Aegean.html',name:'Sol Cosmopolitan Rhodes',location:'Rhodes Town, Rhodes, Greece',julyTemp:28,beach:'~300m to beach',image:'Sol Cosmopolitan Rhodes.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g635613-d500438-Reviews-Canvas_by_Mitsis_Petit_Palais-Rhodes_Town_Rhodes_Dodecanese_South_Aegean.html',name:'Canvas by Mitsis Petit Palais',location:'Rhodes Town, Rhodes, Greece',julyTemp:28,beach:'~200m to beach',image:'Canvas by Mitsis Petit Palais.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g503710-d250616-Reviews-Silva_Beach-Hersonissos_Crete.html',name:'Silva Beach',location:'Hersonissos, Crete, Greece',julyTemp:29,beach:'On the beach',image:'Silva Beach.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g659629-d496247-Reviews-Golden_Sun_Resort_Spa-Kalamaki_Zakynthos_Ionian_Islands.html',name:'Golden Sun Resort & Spa',location:'Kalamaki, Zakynthos, Greece',julyTemp:30,beach:'~150m to beach'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g8242451-d595581-Reviews-Blue_Bay_Resort_Hotel-Mononaftis_Crete.html',name:'Blue Bay Resort Hotel',location:'Mononaftis, Crete, Greece',julyTemp:29,beach:'On the beach',image:'Blue Bay Resort Hotel.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g503710-d500649-Reviews-Grand_Hotel_Holiday_Resort-Hersonissos_Crete.html',name:'Grand Hotel Holiday Resort',location:'Hersonissos, Crete, Greece',julyTemp:29,beach:'~100m to beach'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g635614-d289547-Reviews-Blue_Bay_Beach_Resort-Ialysos_Rhodes_Dodecanese_South_Aegean.html',name:'Blue Bay Beach Resort',location:'Ialysos, Rhodes, Greece',julyTemp:28,beach:'On the beach'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g1191167-d549385-Reviews-Kalyves_Beach_Hotel-Kalyves_Apokoronas_Chania_Prefecture_Crete.html',name:'Kalyves Beach Hotel',location:'Kalyves, Chania, Crete, Greece',julyTemp:29,beach:'On the beach'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g635615-d23909093-Reviews-Blue_Sea_Island-Kolimbia_Rhodes_Dodecanese_South_Aegean.html',name:'Blue Sea Island',location:'Kolimbia, Rhodes, Greece',julyTemp:28,beach:'~50m to beach',image:'Blue Sea Island.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g659630-d576480-Reviews-Canvas_by_Mitsis_Family_Village-Kardamena_Kos_Dodecanese_South_Aegean.html',name:'Canvas by Mitsis Family Village',location:'Kardamena, Kos, Greece',julyTemp:29,beach:'On the beach',image:'Canvas by Mitsis Family Village.webp'},
  {url:'https://www.tripadvisor.co.uk/Hotel_Review-g2290791-d20142612-Reviews-Mythos_Palace_Resort_Adults_Only-Chlomos_Corfu_Ionian_Islands.html',name:'Mythos Palace Resort (Adults Only)',location:'Chlomos, Corfu, Greece',julyTemp:32,beach:'~400m to beach',image:'Mythos Palace Resort (Adults Only).webp'},
];
function makeSeedHotels(){
  return SEED_HOTELS.map((h,i)=>({id:1700000000000+i,url:h.url,name:h.name,location:h.location,julyTemp:h.julyTemp||null,beach:h.beach||'',stars:0,image:'',notes:'',price7:'',price10:'',
    votes:{andrius:0,beatrix:0},reactions:{andrius:{heart:false,up:false,down:false},beatrix:{heart:false,up:false,down:false}},
    paletteIdx:i%PALETTES.length,addedBy:'andrius',image:h.image||''}));
}
async function syncAll(){
  setSS('syncing','Syncing...');
  // Don't overwrite if a price debounce timer is pending
  const pendingPriceSave=Object.keys(priceTimers).some(k=>priceTimers[k]);
  try{
    const r=await sGet(KEY,true);
    if(r&&!saving&&!pendingPriceSave){
      const fresh=JSON.parse(r);
      const changed=JSON.stringify(fresh)!==JSON.stringify(hotels);
      if(changed){hotels=fresh;}
      // Backfill images from seed data for existing hotels that have none
      let backfilled=false;
      hotels.forEach(h=>{
        const seed=SEED_HOTELS.find(s=>s.url===h.url||s.name===h.name);
        if(seed&&seed.image&&!h.image){h.image=seed.image;backfilled=true;}
      });
      if(backfilled){await sSet(KEY,JSON.stringify(hotels),true);}
      if(changed||backfilled)render();
    }
    if(!hotels.length){
      const bk=tryLoadLocalBackup();
      if(bk){hotels=bk;await sSet(KEY,JSON.stringify(hotels),true);render();setSS('ok','Restored from local backup ✓');}
      else{hotels=makeSeedHotels();await sSet(KEY,JSON.stringify(hotels),true);render();}
    }
    setSS('ok','Up to date · syncs every 8s');
  }
  catch(e){if(!hotels.length){hotels=makeSeedHotels();render();}setSS('err','Sync error');}
}
async function persist(){
  saving=true;setSS('syncing','Saving...');
  const ok=await sSet(KEY,JSON.stringify(hotels),true);
  saving=false;
  if(ok){setSS('ok','Saved ✓');await autoExport();}else setSS('err','Save failed');
}
function getDomain(url){try{return new URL(url).hostname.replace('www.','')}catch(e){return url}}
function cap(s){return s.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')}
function extractInfo(url){
  const d=getDomain(url).toLowerCase(),u=url.toLowerCase();
  let name='',loc='',stars=0;
  if(d.includes('booking.com')){const m=u.match(/\/hotel\/([a-z-]+)\/([a-z0-9-]+)/);if(m){loc=m[1].replace(/-/g,' ');name=m[2].replace(/-/g,' ')}else name='Hotel (Booking.com)';}
  else if(d.includes('hotels.com')){const m=u.match(/([a-z0-9-]+)-hotel\./);name=m?m[1].replace(/-/g,' ')+' hotel':'Hotel (Hotels.com)';}
  else if(d.includes('airbnb'))name='Airbnb listing';
  else if(d.includes('tripadvisor'))name='TripAdvisor hotel';
  else if(d.includes('marriott')){name='Marriott hotel';stars=4;}
  else if(d.includes('hilton')){name='Hilton hotel';stars=4;}
  else name=cap(d.split('.')[0].replace(/-/g,' '));
  return{name:cap(name||'Hotel'),location:loc?cap(loc):'',stars};
}

/* ─── EFFECTS ─── */
function burst(el,emoji){
  const r=el.getBoundingClientRect(),b=document.createElement('div');
  b.className='burst';b.textContent=emoji;
  b.style.left=(r.left+r.width/2-12)+'px';b.style.top=(r.top+r.height/2-12)+'px';
  document.body.appendChild(b);setTimeout(()=>b.remove(),1000);
}
function popBtn(el){el.classList.remove('popping');void el.offsetWidth;el.classList.add('popping');setTimeout(()=>el.classList.remove('popping'),420);}
function confetti(){
  const cols=['#E9C46A','#E76F51','#0A9396','#2D6A4F','#FF6FC8','#A29BFE','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';el.style.top='-20px';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.width=(5+Math.random()*9)+'px';el.style.height=(5+Math.random()*9)+'px';
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    el.style.animationDuration=(1.2+Math.random()*1.8)+'s';
    el.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
  }
}

/* ─── ACTIONS ─── */
async function addHotel(){
  if(!currentUser)return;
  const inp=document.getElementById('urlInput'),url=inp.value.trim();
  if(!url)return;
  if(!url.startsWith('http')){setStatus('Please enter a valid URL starting with https://');return;}
  try{const r=await sGet(KEY,true);if(r)hotels=JSON.parse(r);}catch(e){}
  const info=extractInfo(url);
  hotels.push({id:Date.now(),url,name:info.name,location:info.location,stars:info.stars,image:'',notes:'',price7:'',price10:'',
    votes:{andrius:0,beatrix:0},reactions:{andrius:{heart:false,up:false,down:false},beatrix:{heart:false,up:false,down:false}},
    paletteIdx:hotels.length%PALETTES.length,addedBy:currentUser});
  SFX.add();await persist();inp.value='';setStatus('✅ Hotel added!',true);render();
}
function setStatus(m,c){document.getElementById('fetchStatus').innerHTML=m;if(c)setTimeout(()=>document.getElementById('fetchStatus').innerHTML='',3000);}

async function removeHotel(id){
  SFX.remove();
  try{const r=await sGet(KEY,true);if(r)hotels=JSON.parse(r);}catch(e){}
  hotels=hotels.filter(h=>h.id!==id);await persist();render();
}
function getTopId(){
  const r=[...hotels].sort((a,b)=>(avg(b.votes)||0)-(avg(a.votes)||0));
  return r[0]&&avg(r[0].votes)?r[0].id:null;
}
async function setVote(id,score){
  const h=hotels.find(h=>h.id===id);if(!h)return;
  const prev=getTopId();
  SFX.star();h.votes[currentUser]=h.votes[currentUser]===score?0:score;
  await persist();render();
  const nw=getTopId();if(nw&&nw!==prev){SFX.winner();confetti();}
}
async function setHotelStars(id,n){const h=hotels.find(h=>h.id===id);if(!h)return;SFX.star();h.stars=n;await persist();render();}
async function setImage(id,url){const h=hotels.find(h=>h.id===id);if(!h)return;const v=url.trim();if(h.image===v)return;h.image=v;await persist();render();}
async function updateField(id,field,value){const h=hotels.find(h=>h.id===id);if(!h)return;if(h[field]===value)return;h[field]=value;await persist();}
async function updateNotes(id,value){const h=hotels.find(h=>h.id===id);if(!h)return;if(h.notes===value)return;h.notes=value;await persist();}
async function updatePrice(id,field,value){const h=hotels.find(h=>h.id===id);if(!h)return;const v=value?String(Math.round(Number(value))):'';if(h[field]===v)return;h[field]=v;await persist();}

/* Called on every keystroke — auto-fills sibling, saves immediately */
const priceTimers={};
function onPriceInput(id,field,rawVal){
  const h=hotels.find(h=>h.id===id);if(!h)return;
  const v=Number(rawVal);
  // nights for THIS field and the OTHER field
  const myNights  = field==='price7' ? 7  : 10;
  const otherField= field==='price7' ? 'price10' : 'price7';
  const otherNights= field==='price7' ? 10 : 7;

  // Per-night rate from what user typed, then scale to other duration
  if(v>0){
    const perNight=v/myNights;
    const suggested=Math.round(perNight*otherNights);
    const otherEl=document.getElementById(field==='price7'?`p10_${id}`:`p7_${id}`);
    if(otherEl)otherEl.value=suggested;
    h[otherField]=String(suggested);
  }

  h[field]=v>0?String(Math.round(v)):'';

  // Update breakdown live without re-render
  const bdEl=document.getElementById(`pbd_${id}`);
  if(bdEl)bdEl.innerHTML=renderPriceBreakdown(h.price7,h.price10);

  // Debounce the storage write — but hotels object is already updated in memory
  clearTimeout(priceTimers[id]);
  priceTimers[id]=setTimeout(()=>persistNow(),300);
}

// Dedicated immediate save for prices — bypasses saving flag check
async function persistNow(){
  setSS('syncing','Saving...');
  const snap=JSON.stringify(hotels);
  const ok=await sSet(KEY,snap,true);
  if(ok){setSS('ok','Saved ✓');await autoExport();}else setSS('err','Save failed');
}

function renderPriceBreakdown(p7,p10){
  const v7=Number(p7||0),v10=Number(p10||0);
  if(!v7&&!v10)return'';
  const items=[];
  // Per-night is the same regardless of duration — just show once
  const perNight=v7?Math.round(v7/7):(v10?Math.round(v10/10):0);
  items.push(`<div class="price-breakdown-item"><span class="pb-lbl">Per night</span><span class="pb-val">£${perNight}</span></div>`);
  // Per person differs by duration so show both
  if(v7) items.push(`<div class="price-breakdown-item"><span class="pb-lbl">Per person · 7 nights</span><span class="pb-val">£${Math.round(v7/2)}</span></div>`);
  if(v10) items.push(`<div class="price-breakdown-item"><span class="pb-lbl">Per person · 10 nights</span><span class="pb-val">£${Math.round(v10/2)}</span></div>`);
  return items.join('');
}

/* ─── REACTIONS ─── */
async function toggleReaction(id,type,btnEl){
  const h=hotels.find(h=>h.id===id);if(!h)return;
  if(!h.reactions)h.reactions={andrius:{heart:false,up:false,down:false},beatrix:{heart:false,up:false,down:false}};
  if(!h.reactions[currentUser])h.reactions[currentUser]={heart:false,up:false,down:false};
  const r=h.reactions[currentUser];
  const wasOn=r[type];
  if(type==='up'&&!wasOn)r.down=false;
  if(type==='down'&&!wasOn)r.up=false;
  r[type]=!wasOn;
  if(type==='heart'){wasOn?SFX.heartOff():SFX.heart();if(!wasOn)burst(btnEl,'❤️');}
  if(type==='up')   {wasOn?SFX.thumbDown():SFX.thumbUp();if(!wasOn)burst(btnEl,'👍');}
  if(type==='down') {wasOn?SFX.thumbUp():SFX.thumbDown();if(!wasOn)burst(btnEl,'👎');}
  if(btnEl)popBtn(btnEl);
  await persist();render();
}

function avg(v){const a=Object.values(v).filter(x=>x>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function rCount(h,type){let c=0;for(const u of['andrius','beatrix']){if(h.reactions&&h.reactions[u]&&h.reactions[u][type])c++;}return c;}

/* ─── RENDER ─── */
function render(){
  if(!currentUser)return;
  const me=currentUser,other=me==='andrius'?'beatrix':'andrius';
  const mi=USERS[me],oi=USERS[other];
  const grid=document.getElementById('hotelsGrid');
  const empty=document.getElementById('emptyState');
  const results=document.getElementById('resultsSection');
  const rankList=document.getElementById('rankingList');
  if(!hotels.length){grid.innerHTML='';empty.style.display='block';results.style.display='none';return;}
  empty.style.display='none';
  const ranked=[...hotels].sort((a,b)=>(avg(b.votes)||0)-(avg(a.votes)||0));
  const topId=ranked[0]&&avg(ranked[0].votes)?ranked[0].id:null;

  grid.innerHTML=hotels.map(h=>{
    const a=avg(h.votes),isW=h.id===topId;
    const pal=PALETTES[h.paletteIdx%PALETTES.length];
    const mv=h.votes[me]||0,ov=h.votes[other]||0;
    if(!h.reactions)h.reactions={andrius:{heart:false,up:false,down:false},beatrix:{heart:false,up:false,down:false}};
    if(!h.reactions[me])h.reactions[me]={heart:false,up:false,down:false};
    const mr=h.reactions[me];
    const hc=rCount(h,'heart'),uc=rCount(h,'up'),dc=rCount(h,'down');

    const myStars=[1,2,3,4,5].map(i=>`<button class="star-btn ${i<=mv?'active':''}" onclick="setVote(${h.id},${i})">⭐</button>`).join('');
    const hotelStars=[1,2,3,4,5].map(i=>`<button class="star-btn ${i<=h.stars?'active':''}" onclick="setHotelStars(${h.id},${i})" style="color:#E9C46A">★</button>`).join('');

    return`<div class="hotel-card ${isW?'winner':''} ${mr.heart?'is-fav':''}">
      ${isW?'<div class="winner-badge">✨ Top pick</div>':''}
      ${h.image?`<img class="card-img" src="${h.image}" onerror="this.style.display='none'"/>`
               :`<div class="card-img-placeholder" style="background:${pal.bg}"><span style="position:relative;z-index:1">${pal.emoji}</span></div>`}
      <div class="card-body">
        <div class="hotel-name" contenteditable="true" onblur="updateField(${h.id},'name',this.innerText.trim())">${h.name}</div>
        <span class="hotel-location" contenteditable="true" onblur="updateField(${h.id},'location',this.innerText.trim())">${h.location||'Add location...'}</span>
        <div class="info-badges">
          ${h.julyTemp?`<span class="info-badge badge-temp">☀️ ${h.julyTemp}°C in July</span>`:''}
          ${h.beach?`<span class="info-badge badge-beach">🏖️ ${h.beach}</span>`:''}
        </div>
        <div class="reaction-row">
          <button class="reaction-pill heart-pill ${mr.heart?'on':''}" onclick="toggleReaction(${h.id},'heart',this)">❤️ <span class="pill-count">${hc||''}</span></button>
          <button class="reaction-pill up-pill ${mr.up?'on':''}" onclick="toggleReaction(${h.id},'up',this)">👍 <span class="pill-count">${uc||''}</span></button>
          <button class="reaction-pill down-pill ${mr.down?'on':''}" onclick="toggleReaction(${h.id},'down',this)">👎 <span class="pill-count">${dc||''}</span></button>
        </div>
        <span class="section-label">Notes</span>
        <textarea class="field-input" placeholder="Great pool, near beach, free breakfast..." onblur="updateNotes(${h.id},this.value)">${h.notes||''}</textarea>
        <a class="hotel-url" href="${h.url}" target="_blank"><span class="url-dot"></span>${getDomain(h.url)}</a>
        <div class="price-block">
          <div class="price-block-header">
            <span class="price-block-label">💷 Total price</span>
            <span class="price-incl">incl. flights &amp; transfers</span>
          </div>
          <div class="price-section">
            <div class="price-field">
              <label>7 nights</label>
              <div class="price-input-wrap">
                <span class="currency">£</span>
                <input class="price-input" id="p7_${h.id}" type="number" min="0" placeholder="e.g. 1400" value="${h.price7||''}" oninput="onPriceInput(${h.id},'price7',this.value)"/>
              </div>
            </div>
            <div class="price-field">
              <label>10 nights</label>
              <div class="price-input-wrap">
                <span class="currency">£</span>
                <input class="price-input" id="p10_${h.id}" type="number" min="0" placeholder="e.g. 1800" value="${h.price10||''}" oninput="onPriceInput(${h.id},'price10',this.value)"/>
              </div>
            </div>
          </div>
          <div class="price-breakdown" id="pbd_${h.id}">${renderPriceBreakdown(h.price7,h.price10)}</div>
        </div>
        <div class="votes-section">
          <div class="votes-label">Star ratings</div>
          <div class="voter-row">
            <div class="voter-avatar" style="background:${mi.bg};color:${mi.textColor};">${mi.initial}</div>
            <span class="voter-name" style="color:${mi.color}">${mi.name}</span>
            <div class="my-vote-stars">${myStars}</div>
            <span class="vote-score">${mv?mv+'/5':'—'}</span>
          </div>
          <div class="voter-row">
            <div class="voter-avatar" style="background:${oi.bg};color:${oi.textColor};">${oi.initial}</div>
            <span class="voter-name" style="color:${oi.color}">${oi.name}</span>
            <div class="other-vote">${ov?`<span style="letter-spacing:-1px;color:#E9C46A">${'★'.repeat(ov)}${'☆'.repeat(5-ov)}</span>`:`<span style="font-size:11px;color:var(--text-muted)">not rated yet</span>`}</div>
            <span class="vote-score">${ov?ov+'/5':'—'}</span>
          </div>
          ${a!==null?`<div class="avg-score"><span class="avg-label">Combined score</span><span class="avg-val">${a.toFixed(1)} / 5</span></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  const voted=ranked.filter(h=>avg(h.votes)!==null);
  if(voted.length>1){
    results.style.display='block';
    const medals=['🥇','🥈','🥉'];
    rankList.innerHTML=voted.map((h,i)=>{
      const a=avg(h.votes);
      return`<div class="rank-row">
        <span class="rank-num">${medals[i]||(i+1)}</span>
        <span class="rank-name">${h.name}</span>
        <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${(a/5*100).toFixed(0)}%"></div></div>
        <span class="rank-score">${a.toFixed(1)}</span>
      </div>`;
    }).join('');
  } else results.style.display='none';
}

document.getElementById('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')addHotel();});

// Flush any pending price save immediately before page unloads
window.addEventListener('beforeunload',()=>{
  const hasPending=Object.keys(priceTimers).some(k=>priceTimers[k]);
  if(hasPending){
    Object.keys(priceTimers).forEach(k=>{clearTimeout(priceTimers[k]);priceTimers[k]=null;});
    // Use sendBeacon for a fire-and-forget save on unload
    // Fallback: synchronous localStorage mirror so reload doesn't lose data
    try{localStorage.setItem('hotelapp_price_backup',JSON.stringify(hotels));}catch(e){}
  }
});

// On load, merge any price backup that wasn't flushed to shared storage
(function(){
  try{
    const bk=localStorage.getItem('hotelapp_price_backup');
    if(bk){
      const backed=JSON.parse(bk);
      // Will be used in login to pre-populate prices after sync
      window._priceBackup=backed;
      localStorage.removeItem('hotelapp_price_backup');
    }
  }catch(e){}
})();
</script>
